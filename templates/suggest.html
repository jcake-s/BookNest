{% extends "layout.html" %}

{% block title %}Suggest a Book{% endblock %}

{% block main %}

    <h1 class="mb-4">Suggest a Book</h1>
    <form action="/suggest" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control" name="title" placeholder="Title" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" class="form-control" name="author" placeholder="Author" type="text">
        </div>
        <div class="mb-3">
            <textarea class="form-control" name="description" placeholder="Why should the nest read this?" rows="4"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Suggest</button>
    </form>

{% endblock %}
