<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BookNest: {% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <img src="/static/booknested.png" alt="BookNest Logo" width="50" height="40" class="me-2">
                    <span>BookNest</span>
                </a>
                <ul class="navbar-nav ms-auto">
                    {% if session.user_id %}
                        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
                        <li class="nav-item"><a class="nav-link" href="/suggest">Suggest</a></li>
                        <li class="nav-item"><a class="nav-link" href="/profile/{{ session.username }}">Profile</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout">Log Out</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                        <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                    {% endif %}
                </ul>
            </div>
        </nav>
        <main class="container mt-4">
            {% block main %}{% endblock %}
        </main>
        <footer class="text-center text-muted py-4">
            <small>© 2026 BookNest · CS50x Final Project</small>
        </footer>
    </body>
</html>
